# ==============================================================================
# Production Nginx Reverse Proxy Configuration for BIA Textiles Website
# Location on Ubuntu: /etc/nginx/sites-available/bia-website
# ==============================================================================

# Rate limiting zone to protect against DoS/brute force attacks
limit_req_zone $binary_remote_addr zone=bia_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=bia_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your domain or server IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL is installed)
    # return 301 https://$host$request_uri;

    # If running over HTTP initially (internal IP):
    location / {
        limit_req zone=bia_limit burst=30 nodelay;
        limit_conn bia_conn 20;

        # Proxy to Docker container running locally on port 5000
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer & Timeout Protections
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Block hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

